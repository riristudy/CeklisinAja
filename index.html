<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily Check</title>
<style>
  :root { --bg:#fafaf7; --fg:#1f2933; --card:#ffffff; --ac:#2f6f5e; --bd:#dde3df; --mute:#6b7a73; --bahaya:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161a18; --fg:#e8ece9; --card:#1f2623; --ac:#7cc4ae; --bd:#34413b; --mute:#9aaaa2; --bahaya:#e06c5f; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:17px/1.5 system-ui, sans-serif; max-width:560px; margin-inline:auto; }
  .atas { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { margin:0; font-size:1.6rem; color:var(--ac); }
  #tanggal { margin:2px 0 14px; color:var(--mute); }
  .tab { display:flex; gap:8px; margin:0 0 14px; }
  .tab button { flex:1; padding:9px 4px; font:inherit; font-size:.95rem; color:var(--fg); background:transparent;
                border:1px solid var(--bd); border-radius:10px; cursor:pointer; }
  .tab button.aktif { background:var(--ac); color:var(--bg); border-color:var(--ac); font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  li { margin:8px 0; display:flex; gap:8px; align-items:stretch; }
  li.judul-tgl { display:block; margin:18px 0 4px; font-weight:600; color:var(--mute); }
  .baris { flex:1; display:flex; align-items:center; gap:14px; padding:14px;
           background:var(--card); border:1px solid var(--bd); border-radius:12px; }
  input[type=checkbox], input[type=radio] { width:24px; height:24px; accent-color:var(--ac); flex:none; }
  .jam { font-variant-numeric:tabular-nums; font-weight:700; min-width:3.4em; }
  .nama { flex:1; }
  .kat { font-size:.8rem; color:var(--mute); display:block; }
  .tl { display:none; font-size:.8rem; color:var(--bahaya); font-weight:600; }
  li.terlewat:not(.selesai) .tl { display:block; }
  li.selesai .nama { text-decoration:line-through; color:var(--mute); }
  li.nonaktif .baris { opacity:.55; }
  .stat { width:1.4em; text-align:center; font-weight:700; flex:none; }
  .stat.ok { color:var(--ac); }
  .stat.tl2 { color:var(--bahaya); }
  .label-stat { font-size:.8rem; color:var(--mute); }
  .ikon { width:48px; flex:none; font-size:1.2rem; color:var(--fg); background:var(--card);
          border:1px solid var(--bd); border-radius:12px; cursor:pointer; }
  #pesan { color:var(--mute); }
  .galat { color:var(--bahaya); min-height:1.4em; margin:6px 0; }
  .tombol { background:var(--ac); color:var(--bg); border:0; border-radius:10px;
            padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
  .tombol.sekunder { background:transparent; color:var(--fg); border:1px solid var(--bd); }
  .tombol.bahaya { background:var(--bahaya); color:#fff; }
  .tombol.garis-bahaya { background:transparent; color:var(--bahaya); border:1px solid var(--bahaya); }
  .tombol:disabled { opacity:.6; }
  dialog { width:min(92vw, 460px); border:1px solid var(--bd); border-radius:14px;
           background:var(--card); color:var(--fg); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h2 { margin:0 0 12px; font-size:1.2rem; }
  .f { display:block; margin:10px 0; font-size:.95rem; color:var(--mute); }
  .f input { display:block; width:100%; margin-top:4px; padding:10px; font:inherit;
             color:var(--fg); background:var(--bg); border:1px solid var(--bd); border-radius:8px; }
  fieldset { border:1px solid var(--bd); border-radius:10px; margin:12px 0; padding:8px 12px; }
  legend { color:var(--mute); font-size:.95rem; padding:0 6px; }
  .r { display:flex; align-items:center; gap:10px; padding:6px 0; color:var(--fg); }
  #boxHari { display:flex; flex-wrap:wrap; gap:6px 14px; padding:2px 0 8px 34px; }
  #boxHari label { display:flex; align-items:center; gap:6px; }
  #boxHari input { width:20px; height:20px; }
  #fTanggal { margin:0 0 6px 34px; width:calc(100% - 34px); }
  .aksi { display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }
  .aksi .kiri { margin-right:auto; }
</style>
</head>
<body>
  <header class="atas">
    <div>
      <h1 id="judul">Hari Ini</h1>
      <p id="tanggal"></p>
    </div>
    <button id="btnTambah" class="tombol">+ Tambah</button>
  </header>

  <nav class="tab">
    <button id="tabHari" class="aktif">Hari Ini</button>
    <button id="tabSemua">Semua</button>
    <button id="tabRiwayat">Riwayat</button>
  </nav>

  <p id="pesan">Memuat…</p>
  <ul id="daftar"></ul>

  <dialog id="dlg">
    <h2 id="judulForm">Kegiatan Baru</h2>
    <label class="f">Nama kegiatan
      <input id="fNama" type="text" maxlength="60" placeholder="mis. Olahraga sore">
    </label>
    <label class="f">Kategori
      <input id="fKat" type="text" list="daftarKat" maxlength="30" placeholder="mis. Belajar">
    </label>
    <datalist id="daftarKat"></datalist>
    <label class="f">Jam mulai
      <input id="fMulai" type="time">
    </label>
    <fieldset>
      <legend>Pola jadwal</legend>
      <label class="r"><input type="radio" name="pola" value="harian" checked> Setiap hari</label>
      <label class="r"><input type="radio" name="pola" value="mingguan"> Hari tertentu tiap minggu</label>
      <div id="boxHari" hidden></div>
      <label class="r"><input type="radio" name="pola" value="sekali"> Sekali saja di tanggal tertentu</label>
      <input id="fTanggal" class="f" type="date" hidden>
    </fieldset>
    <p id="galatForm" class="galat"></p>
    <div class="aksi">
      <button id="btnHapus" class="tombol garis-bahaya kiri" hidden>Hapus</button>
      <button id="btnBatal" class="tombol sekunder">Batal</button>
      <button id="btnSimpan" class="tombol">Simpan</button>
    </div>
  </dialog>

  <dialog id="dlgHapus">
    <h2>Hapus kegiatan?</h2>
    <p id="teksHapus"></p>
    <p id="galatHapus" class="galat"></p>
    <div class="aksi">
      <button id="btnBatalHapus" class="tombol sekunder">Batal</button>
      <button id="btnYaHapus" class="tombol bahaya">Ya, hapus</button>
    </div>
  </dialog>

<script>
  // GANTI dengan URL aplikasi web dari Langkah 1 (berakhiran /exec)
  const URL_API = 'https://script.google.com/macros/s/AKfycbwbGxpSb8TB5I7gSPbiLhhx4BrA7H4TSWwNSPHzmbQOAQpZuqQvwinzP9P5vl3EdltD/exec';

  const SINGKATAN = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];   // urutan getDay()
  const HARI_URUT = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];   // urutan di formulir
  const NAMA_HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli',
                      'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  const sekarang = new Date();
  const dua = n => String(n).padStart(2, '0');
  const HARI_INI = sekarang.getFullYear() + '-' + dua(sekarang.getMonth() + 1) + '-' + dua(sekarang.getDate());

  document.getElementById('tanggal').textContent =
    NAMA_HARI[sekarang.getDay()] + ', ' + sekarang.getDate() + ' ' +
    NAMA_BULAN[sekarang.getMonth()] + ' ' + sekarang.getFullYear();

  const pesanEl = document.getElementById('pesan');
  const daftarEl = document.getElementById('daftar');
  const judulEl = document.getElementById('judul');
  const tabHari = document.getElementById('tabHari');
  const tabSemua = document.getElementById('tabSemua');
  const tabRiwayat = document.getElementById('tabRiwayat');

  // state: kondisi aplikasi saat ini
  let dataKegiatan = [];
  let dataLog = [];
  let tampilan = 'hari';   // 'hari', 'semua', atau 'riwayat'
  let idEdit = null;       // null = mode tambah, selain itu = mode ubah
  let namaEdit = '';

  function tampilPesan(teks, galat) {
    pesanEl.textContent = teks;
    pesanEl.className = galat ? 'galat' : '';
  }

  function rapikanJam(j) {
    const m = String(j || '').trim().replace('.', ':').split(':');
    return m.length < 2 ? String(j || '') : dua(parseInt(m[0], 10)) + ':' + dua(parseInt(m[1], 10));
  }

  function cocokHariIni(k) {
    const h = String(k.Hari || '').trim();
    if (h.toLowerCase() === 'setiap hari') return true;
    if (h === HARI_INI) return true;
    return h.split(',').map(x => x.trim()).indexOf(SINGKATAN[sekarang.getDay()]) !== -1;
  }

  async function ambil(aksi) {
    const r = await fetch(URL_API + '?aksi=' + aksi);
    return r.json();
  }

  async function muat() {
    try {
      const [kegiatan, log] = await Promise.all([ambil('kegiatan'), ambil('log')]);
      if (!Array.isArray(kegiatan) || !Array.isArray(log)) throw new Error('data tidak valid');
      dataKegiatan = kegiatan;
      dataLog = log;
      isiSaranKategori(kegiatan);
      render();
    } catch (e) {
      tampilPesan('Gagal memuat data. Cek koneksi internet dan URL_API.', true);
    }
  }

  function render() {
    judulEl.textContent = { hari: 'Hari Ini', semua: 'Semua Kegiatan', riwayat: 'Riwayat' }[tampilan];
    tabHari.classList.toggle('aktif', tampilan === 'hari');
    tabSemua.classList.toggle('aktif', tampilan === 'semua');
    tabRiwayat.classList.toggle('aktif', tampilan === 'riwayat');
    daftarEl.textContent = '';

    if (tampilan === 'riwayat') { renderRiwayat(); return; }

    const selesai = new Set(
      dataLog.filter(l => l.Tanggal === HARI_INI && l.Status === 'Selesai').map(l => l.ID)
    );
    const daftar = (tampilan === 'hari'
      ? dataKegiatan.filter(k => k.Aktif === 'Ya' && cocokHariIni(k))
      : dataKegiatan.slice()
    ).sort((a, b) => rapikanJam(a.Mulai).localeCompare(rapikanJam(b.Mulai)));

    if (daftar.length === 0) {
      tampilPesan(tampilan === 'hari' ? 'Tidak ada kegiatan hari ini.' : 'Belum ada kegiatan.');
      return;
    }
    tampilPesan('');
    daftar.forEach(k => daftarEl.appendChild(buatBaris(k, selesai.has(k.ID))));
  }

  function buatBaris(k, sudah) {
    const li = document.createElement('li');
    const modeHari = tampilan === 'hari';
    const terlewat = modeHari && !sudah &&
      dataLog.some(l => l.Tanggal === HARI_INI && l.ID === k.ID && l.Status === 'Terlewat');
    const kelas = [];
    if (modeHari && sudah) kelas.push('selesai');
    if (terlewat) kelas.push('terlewat');
    if (!modeHari && k.Aktif !== 'Ya') kelas.push('nonaktif');
    li.className = kelas.join(' ');

    const kotak = document.createElement(modeHari ? 'label' : 'div');
    kotak.className = 'baris';

    let cb = null;
    if (modeHari) {
      cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = sudah;
      kotak.appendChild(cb);
    }

    const jam = document.createElement('span');
    jam.className = 'jam';
    jam.textContent = rapikanJam(k.Mulai);

    const nama = document.createElement('span');
    nama.className = 'nama';
    nama.textContent = k.Nama;
    const kat = document.createElement('span');
    kat.className = 'kat';
    kat.textContent = modeHari
      ? k.Kategori
      : k.Kategori + ' · ' + String(k.Hari).replace(/,/g, ', ') + (k.Aktif !== 'Ya' ? ' · nonaktif' : '');
    nama.appendChild(kat);
    if (modeHari) {
      const tl = document.createElement('span');
      tl.className = 'tl';
      tl.textContent = 'Terlewat';
      nama.appendChild(tl);
    }

    kotak.append(jam, nama);
    li.appendChild(kotak);

    const ubah = document.createElement('button');
    ubah.className = 'ikon';
    ubah.textContent = '✎';
    ubah.setAttribute('aria-label', 'Ubah ' + k.Nama);
    ubah.addEventListener('click', () => bukaForm(k));
    li.appendChild(ubah);

    if (cb) cb.addEventListener('change', () => simpanCentang(k.ID, cb, li));
    return li;
  }

  async function simpanCentang(id, cb, li) {
    const centang = cb.checked;
    li.classList.toggle('selesai', centang);
    cb.disabled = true;
    try {
      const url = URL_API + '?aksi=centang&tanggal=' + HARI_INI + '&id=' +
                  encodeURIComponent(id) + '&status=' + (centang ? 'Selesai' : 'Batal');
      const hasil = await (await fetch(url)).json();
      if (!hasil.ok) throw new Error(hasil.error || 'gagal');
      // perbarui salinan log di memori (catatan lama Selesai/Terlewat diganti)
      dataLog = dataLog.filter(l => !(l.Tanggal === HARI_INI && l.ID === id));
      if (centang) dataLog.push({ Tanggal: HARI_INI, ID: id, Status: 'Selesai' });
      tampilPesan('');
    } catch (e) {
      cb.checked = !centang;
      li.classList.toggle('selesai', !centang);
      tampilPesan('Gagal menyimpan centang. Coba lagi.', true);
    }
    cb.disabled = false;
  }

  /* ---------- Riwayat ---------- */
  function formatTanggal(t) {
    const p = t.split('-').map(Number);
    const d = new Date(p[0], p[1] - 1, p[2]);
    return NAMA_HARI[d.getDay()] + ', ' + p[2] + ' ' + NAMA_BULAN[p[1] - 1] + ' ' + p[0] +
           (t === HARI_INI ? ' (hari ini)' : '');
  }

  function jamDari(id) {
    const k = dataKegiatan.find(x => x.ID === id);
    return k ? rapikanJam(k.Mulai) : '';
  }

  function renderRiwayat() {
    const perTanggal = {};
    dataLog.forEach(l => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(l.Tanggal)) return;
      (perTanggal[l.Tanggal] = perTanggal[l.Tanggal] || []).push(l);
    });
    const urut = Object.keys(perTanggal).sort().reverse().slice(0, 14);
    if (urut.length === 0) { tampilPesan('Belum ada riwayat.'); return; }
    tampilPesan('Menampilkan sampai 14 hari terakhir.');

    urut.forEach(t => {
      const judul = document.createElement('li');
      judul.className = 'judul-tgl';
      judul.textContent = formatTanggal(t);
      daftarEl.appendChild(judul);

      perTanggal[t]
        .sort((a, b) => (jamDari(a.ID) || '99:99').localeCompare(jamDari(b.ID) || '99:99'))
        .forEach(l => daftarEl.appendChild(barisRiwayat(l)));
    });
  }

  function barisRiwayat(l) {
    const li = document.createElement('li');
    const kotak = document.createElement('div');
    kotak.className = 'baris';
    const ok = l.Status === 'Selesai';

    const stat = document.createElement('span');
    stat.className = 'stat ' + (ok ? 'ok' : 'tl2');
    stat.textContent = ok ? '✓' : '✕';

    const jam = document.createElement('span');
    jam.className = 'jam';
    jam.textContent = jamDari(l.ID) || '--:--';

    const nama = document.createElement('span');
    nama.className = 'nama';
    nama.textContent = l.Nama || l.ID;

    const label = document.createElement('span');
    label.className = 'label-stat';
    label.textContent = ok ? 'Selesai' : 'Terlewat';

    kotak.append(stat, jam, nama, label);
    li.appendChild(kotak);
    return li;
  }

  tabHari.addEventListener('click', () => { tampilan = 'hari'; render(); });
  tabSemua.addEventListener('click', () => { tampilan = 'semua'; render(); });
  tabRiwayat.addEventListener('click', () => { tampilan = 'riwayat'; render(); });

  /* ---------- Formulir tambah / ubah ---------- */
  const dlg = document.getElementById('dlg');
  const judulForm = document.getElementById('judulForm');
  const fNama = document.getElementById('fNama');
  const fKat = document.getElementById('fKat');
  const fMulai = document.getElementById('fMulai');
  const fTanggal = document.getElementById('fTanggal');
  const boxHari = document.getElementById('boxHari');
  const galatForm = document.getElementById('galatForm');
  const btnSimpan = document.getElementById('btnSimpan');
  const btnHapus = document.getElementById('btnHapus');

  HARI_URUT.forEach(h => {
    const l = document.createElement('label');
    const c = document.createElement('input');
    c.type = 'checkbox';
    c.value = h;
    l.append(c, h);
    boxHari.appendChild(l);
  });

  function isiSaranKategori(kegiatan) {
    const set = new Set(kegiatan.map(k => k.Kategori).filter(Boolean));
    const dl = document.getElementById('daftarKat');
    dl.textContent = '';
    set.forEach(n => {
      const o = document.createElement('option');
      o.value = n;
      dl.appendChild(o);
    });
  }

  function polaDipilih() {
    return document.querySelector('input[name=pola]:checked').value;
  }

  function aturTampilanPola() {
    boxHari.hidden = polaDipilih() !== 'mingguan';
    fTanggal.hidden = polaDipilih() !== 'sekali';
  }
  document.querySelectorAll('input[name=pola]').forEach(r => r.addEventListener('change', aturTampilanPola));

  function bukaForm(k) {
    idEdit = k ? k.ID : null;
    namaEdit = k ? k.Nama : '';
    judulForm.textContent = k ? 'Ubah Kegiatan' : 'Kegiatan Baru';
    btnHapus.hidden = !k;

    fNama.value = k ? k.Nama : '';
    fKat.value = k ? k.Kategori : '';
    fMulai.value = k ? rapikanJam(k.Mulai) : '';
    fTanggal.value = '';
    boxHari.querySelectorAll('input').forEach(c => { c.checked = false; });

    let pola = 'harian';
    if (k) {
      const h = String(k.Hari || '').trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(h)) {
        pola = 'sekali';
        fTanggal.value = h;
      } else if (h.toLowerCase() !== 'setiap hari') {
        pola = 'mingguan';
        const arr = h.split(',').map(x => x.trim());
        boxHari.querySelectorAll('input').forEach(c => { c.checked = arr.indexOf(c.value) !== -1; });
      }
    }
    document.querySelector('input[name=pola][value=' + pola + ']').checked = true;
    aturTampilanPola();
    galatForm.textContent = '';
    dlg.showModal();
  }

  document.getElementById('btnTambah').addEventListener('click', () => bukaForm(null));
  document.getElementById('btnBatal').addEventListener('click', () => dlg.close());

  btnSimpan.addEventListener('click', async () => {
    const nama = fNama.value.trim();
    const kategori = fKat.value.trim() || 'Umum';
    const mulai = fMulai.value;
    const pola = polaDipilih();
    let hari = '';

    if (!nama) { galatForm.textContent = 'Nama kegiatan wajib diisi.'; return; }
    if (!mulai) { galatForm.textContent = 'Jam mulai wajib diisi.'; return; }

    if (pola === 'harian') {
      hari = 'Setiap hari';
    } else if (pola === 'mingguan') {
      const pilih = Array.from(boxHari.querySelectorAll('input:checked')).map(c => c.value);
      if (pilih.length === 0) { galatForm.textContent = 'Pilih minimal satu hari.'; return; }
      hari = pilih.join(',');
    } else {
      hari = fTanggal.value;
      if (!hari) { galatForm.textContent = 'Pilih tanggalnya.'; return; }
    }

    galatForm.textContent = '';
    btnSimpan.disabled = true;
    btnSimpan.textContent = 'Menyimpan…';
    try {
      const url = URL_API + (idEdit ? '?aksi=ubah&id=' + encodeURIComponent(idEdit) : '?aksi=tambah') +
        '&nama=' + encodeURIComponent(nama) +
        '&kategori=' + encodeURIComponent(kategori) +
        '&hari=' + encodeURIComponent(hari) +
        '&mulai=' + encodeURIComponent(mulai);
      const hasil = await (await fetch(url)).json();
      if (!hasil.ok) throw new Error(hasil.error || 'gagal');
      const kataKerja = idEdit ? 'diperbarui' : 'ditambahkan';
      dlg.close();
      await muat();
      tampilPesan(hasil.peringatan ? hasil.peringatan : 'Kegiatan "' + nama + '" ' + kataKerja + '.', !!hasil.peringatan);
    } catch (e) {
      galatForm.textContent = 'Gagal menyimpan: ' + e.message;
    }
    btnSimpan.disabled = false;
    btnSimpan.textContent = 'Simpan';
  });

  /* ---------- Hapus dengan konfirmasi ---------- */
  const dlgHapus = document.getElementById('dlgHapus');
  const galatHapus = document.getElementById('galatHapus');
  const btnYaHapus = document.getElementById('btnYaHapus');

  btnHapus.addEventListener('click', () => {
    dlg.close();
    document.getElementById('teksHapus').textContent =
      'Kegiatan "' + namaEdit + '" akan dihapus dari daftar dan dari Calendar. Riwayat lama tetap tersimpan di Log.';
    galatHapus.textContent = '';
    dlgHapus.showModal();
  });

  document.getElementById('btnBatalHapus').addEventListener('click', () => {
    dlgHapus.close();
    dlg.showModal();
  });

  btnYaHapus.addEventListener('click', async () => {
    btnYaHapus.disabled = true;
    btnYaHapus.textContent = 'Menghapus…';
    try {
      const hasil = await (await fetch(URL_API + '?aksi=hapus&id=' + encodeURIComponent(idEdit))).json();
      if (!hasil.ok) throw new Error(hasil.error || 'gagal');
      dlgHapus.close();
      await muat();
      tampilPesan(hasil.peringatan ? hasil.peringatan : 'Kegiatan "' + namaEdit + '" dihapus.', !!hasil.peringatan);
    } catch (e) {
      galatHapus.textContent = 'Gagal menghapus: ' + e.message;
    }
    btnYaHapus.disabled = false;
    btnYaHapus.textContent = 'Ya, hapus';
